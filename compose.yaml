services:
  app:
    image: ${APP_IMAGE:-spring-ai-ops:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "7079:7079"
      - "127.0.0.1:7081:7081"
    volumes:
      - repository-data:/app/data/repository

volumes:
  repository-data:
